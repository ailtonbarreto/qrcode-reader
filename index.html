<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Leitor de QR Code</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

    <main>

        <div class="leitor">

            <div id="reader"></div>


        </div>


        <div class="resultado">

            <p>Resutado:</p>

            <p id="resultado"></p>

        </div>


    </main>



    <script>
        const conteudo = document.getElementById("resultado");

        function onScanSuccess(decodedText) {
            conteudo.innerHTML = decodedText;

            // vibra no celular ao detectar
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function onScanError(errorMessage) {
            console.log("Erro: ", errorMessage);
        }

        const html5QrCode = new Html5Qrcode("reader");

        Html5Qrcode.getCameras().then(cameras => {
            if (!cameras || cameras.length === 0) return;

            // tenta achar a câmera traseira
            const traseira = cameras.find(cam =>
                cam.label.toLowerCase().includes("back")
                || cam.label.toLowerCase().includes("traseira")
                || cam.label.toLowerCase().includes("rear")
            );

            const cameraId = traseira ? traseira.id : cameras[0].id;
            html5QrCode.start(
                cameraId,
                {
                    fps: 15,
                    qrbox: 400,
                    aspectRatio: 1.0
                },
                onScanSuccess,
                onScanError
            );

        });

    </script>

</body>

</html>
